name: indonesia-wildfire-intelligence

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.5.17
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: wildfire
      CLICKHOUSE_USER: wildfire_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?set CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_BACKEND_PASSWORD: ${CLICKHOUSE_BACKEND_PASSWORD:?set CLICKHOUSE_BACKEND_PASSWORD}
      CLICKHOUSE_INGESTOR_PASSWORD: ${CLICKHOUSE_INGESTOR_PASSWORD:?set CLICKHOUSE_INGESTOR_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./data/clickhouse/migrations/001_d06_physical_model.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data/clickhouse/migrations/002_d06_backend_reader_role.sql:/docker-entrypoint-initdb.d/02-reader-role.sql:ro
      - ./data/clickhouse/migrations/003_d08_multiyear_release.sql:/docker-entrypoint-initdb.d/03-multiyear.sql:ro
      - ./infrastructure/clickhouse/04-create-service-users.sh:/docker-entrypoint-initdb.d/04-create-service-users.sh:ro
    networks:
      - data_plane
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT:-3g}
    cpus: ${CLICKHOUSE_CPU_LIMIT:-2.0}
    # ClickHouse 25.8 initializes a 512-thread background pool before serving.
    # Leave headroom for the server, health check, and initialization processes.
    pids_limit: 1024
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    logging: *default-logging

  backend:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-ridhotr27}/indonesia-wildfire-intelligence-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    command:
      - uvicorn
      - wildfire_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=${TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
    environment:
      WILDFIRE_ENVIRONMENT: production
      WILDFIRE_LOG_LEVEL: ${WILDFIRE_LOG_LEVEL:-INFO}
      WILDFIRE_CORS_ORIGINS: ${WILDFIRE_CORS_ORIGINS:-}
      WILDFIRE_CLIENT_ID_SALT: ${WILDFIRE_CLIENT_ID_SALT:?set WILDFIRE_CLIENT_ID_SALT}
      WILDFIRE_ANALYTICS_BACKEND: clickhouse
      WILDFIRE_CLICKHOUSE_URL: http://clickhouse:8123
      WILDFIRE_CLICKHOUSE_DATABASE: wildfire
      WILDFIRE_CLICKHOUSE_USERNAME: wildfire_backend
      WILDFIRE_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_BACKEND_PASSWORD:?set CLICKHOUSE_BACKEND_PASSWORD}
      WILDFIRE_CLICKHOUSE_TIMEOUT_SECONDS: ${WILDFIRE_CLICKHOUSE_TIMEOUT_SECONDS:-5}
      WILDFIRE_MAX_REQUEST_BODY_BYTES: ${WILDFIRE_MAX_REQUEST_BODY_BYTES:-65536}
      WILDFIRE_REQUEST_TIMEOUT_SECONDS: ${WILDFIRE_REQUEST_TIMEOUT_SECONDS:-120}
      WILDFIRE_PER_CLIENT_REQUESTS_PER_MINUTE: ${WILDFIRE_PER_CLIENT_REQUESTS_PER_MINUTE:-30}
      WILDFIRE_GLOBAL_REQUESTS_PER_MINUTE: ${WILDFIRE_GLOBAL_REQUESTS_PER_MINUTE:-300}
      WILDFIRE_MAX_CONCURRENT_REQUESTS: ${WILDFIRE_MAX_CONCURRENT_REQUESTS:-20}
      WILDFIRE_ASSISTANT_PROFILE: degraded
      WILDFIRE_AGENT_PLANNER_BACKEND: deterministic
      WILDFIRE_INTENT_PLANNING_MODE: disabled
      WILDFIRE_SEMANTIC_ROUTING_MODE: disabled
      WILDFIRE_RAG_BACKEND: local
      WILDFIRE_QDRANT_PATH: /app/backend/data/qdrant-local-hashing
      WILDFIRE_QDRANT_COLLECTION: nasa_firms_documents_v1
      WILDFIRE_RAG_RETRIEVAL_PROFILE: hybrid_rrf
      WILDFIRE_RAG_CHUNKING_PROFILE: recursive-character-1400-200-v1
      WILDFIRE_EMBEDDING_PROVIDER: hashing
      WILDFIRE_EMBEDDING_MODEL_NAME: all-minilm
      WILDFIRE_AGENT_MODEL_PROVIDER: extractive
      WILDFIRE_AGENT_MAX_GRAPH_STEPS: ${WILDFIRE_AGENT_MAX_GRAPH_STEPS:-6}
      WILDFIRE_AGENT_MAX_TOOL_CALLS: ${WILDFIRE_AGENT_MAX_TOOL_CALLS:-2}
      WILDFIRE_AGENT_TIMEOUT_SECONDS: ${WILDFIRE_AGENT_TIMEOUT_SECONDS:-120}
      WILDFIRE_AGENT_MAX_RETRIEVED_CHARACTERS: ${WILDFIRE_AGENT_MAX_RETRIEVED_CHARACTERS:-3000}
      WILDFIRE_AGENT_MAX_MODEL_TOKENS: ${WILDFIRE_AGENT_MAX_MODEL_TOKENS:-192}
    volumes:
      - rag_indexes:/app/backend/data
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      data_plane:
      edge:
        aliases:
          - wildfire-backend
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    pids_limit: 256
    logging: *default-logging

  frontend:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-ridhotr27}/indonesia-wildfire-intelligence-frontend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      WILDFIRE_FRONTEND_API_MODE: real
      WILDFIRE_PUBLIC_API_BASE_URL: ${WILDFIRE_PUBLIC_API_BASE_URL:?set WILDFIRE_PUBLIC_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      edge:
        aliases:
          - wildfire-frontend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.75}
    pids_limit: 256
    logging: *default-logging

  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      WILDFIRE_DOMAIN: ${WILDFIRE_DOMAIN:?set WILDFIRE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging: *default-logging

  rag-init:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-ridhotr27}/indonesia-wildfire-intelligence-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    profiles: ["initialize"]
    user: "10001:10001"
    command:
      - python
      - -m
      - wildfire_api.rag.cli
      - --location
      - /app/backend/data/qdrant-local-hashing
      - --embedding-provider
      - hashing
      - --chunking-profile
      - recursive-character-1400-200-v1
      - --retrieval-profile
      - hybrid_rrf
    volumes:
      - rag_indexes:/app/backend/data
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: *default-logging

  data-loader:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:-ridhotr27}/indonesia-wildfire-intelligence-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    profiles: ["initialize"]
    user: "10001:10001"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_INGESTOR_PASSWORD:?set CLICKHOUSE_INGESTOR_PASSWORD}
    command:
      - python
      - /app/data/scripts/load_clickhouse_v1.py
      - --url
      - http://clickhouse:8123
      - --database
      - wildfire
      - --username
      - wildfire_ingestor
      - --batch-dir
      - /app/ingest/${DATA_BATCH_ID:?set DATA_BATCH_ID to the verified batch directory name}
      - --lock-dir
      - /tmp/wildfire-loader-locks
    volumes:
      - ${DATA_BATCH_DIR:-./data/derived/not-configured}:/app/ingest/${DATA_BATCH_ID:?set DATA_BATCH_ID to the verified batch directory name}:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - data_plane
    read_only: true
    tmpfs:
      # D08's largest checksum-verified annual NDJSON payload is ~251 MiB and
      # is staged in a temporary file before the HTTP insert.
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging: *default-logging

networks:
  data_plane:
    internal: true
  edge:
    name: ${EDGE_NETWORK:-wildfire_edge}
    external: true

volumes:
  clickhouse_data:
    name: ${CLICKHOUSE_DATA_VOLUME:-wildfire_clickhouse_data}
  clickhouse_logs:
    name: ${CLICKHOUSE_LOG_VOLUME:-wildfire_clickhouse_logs}
  rag_indexes:
    name: ${RAG_INDEX_VOLUME:-wildfire_rag_indexes}
  caddy_data:
    name: ${CADDY_DATA_VOLUME:-wildfire_caddy_data}
  caddy_config:
    name: ${CADDY_CONFIG_VOLUME:-wildfire_caddy_config}
