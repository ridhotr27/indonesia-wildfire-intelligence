name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev,rag]'
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Backend tests
        working-directory: backend
        run: pytest

  data:
    name: Data contract and pipeline tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install -r data/requirements-validation.txt
      - name: Data tests
        run: python -m unittest discover -s data/tests -p 'test_*.py'

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck

  compose:
    name: Compose validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create validation environment
        run: cp .env.example .env.ci
      - name: Validate production Compose
        run: docker compose --env-file .env.ci -f docker-compose.prod.yml config --quiet
      - name: Validate deployed overlays
        env:
          BACKEND_IMAGE_REF: ghcr.io/example/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          FRONTEND_IMAGE_REF: ghcr.io/example/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: docker compose --env-file .env.ci -f docker-compose.prod.yml -f docker-compose.low-memory.yml -f infrastructure/compose-images.yml config --quiet

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-24.04
    needs: [backend, data, frontend, compose]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/indonesia-wildfire-intelligence-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
      - name: Record published digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > "${{ matrix.image }}.digest"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.image }}
          path: ${{ matrix.image }}.digest
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Wildfire application images
    runs-on: ubuntu-24.04
    needs: [images]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    concurrency:
      group: wildfire-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Validate digests and deployment settings
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          [[ -n "$SSH_KEY" && -n "$HOST_KEYS" ]]
          [[ "$(cat backend.digest)" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(cat frontend.digest)" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash -n infrastructure/scripts/deploy-release.sh
      - name: Install pinned SSH identity and host key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/wildfire_deploy
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/wildfire_deploy ~/.ssh/known_hosts
      - name: Update backend and frontend on the VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/wildfire_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=10)
          # Host Compose files remain operator-managed. Fail closed if they drift.
          prod_sum=$(sha256sum docker-compose.prod.yml | cut -d' ' -f1)
          low_sum=$(sha256sum docker-compose.low-memory.yml | cut -d' ' -f1)
          images_sum=$(sha256sum infrastructure/compose-images.yml | cut -d' ' -f1)
          scp "${ssh_opts[@]}" infrastructure/compose-images.yml deploy@139.190.108.107:/opt/indonesia-wildfire-intelligence/infrastructure/compose-images.yml
          scp "${ssh_opts[@]}" infrastructure/scripts/deploy-release.sh deploy@139.190.108.107:/opt/indonesia-wildfire-intelligence/infrastructure/scripts/deploy-release.sh
          printf '%s\n' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" deploy@139.190.108.107 \
            "bash /opt/indonesia-wildfire-intelligence/infrastructure/scripts/deploy-release.sh ${GITHUB_SHA} $(cat backend.digest) $(cat frontend.digest) $GHCR_OWNER $GHCR_USER $prod_sum $low_sum $images_sum"
