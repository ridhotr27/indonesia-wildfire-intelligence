# Experimental overlay. Apply after docker-compose.prod.yml; never use as a release approval.
services:
  clickhouse:
    mem_limit: 1024m
    volumes:
      - ./infrastructure/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./infrastructure/clickhouse/low-memory-users.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
  backend:
    mem_limit: 384m
    environment:
      WILDFIRE_MAX_CONCURRENT_REQUESTS: "4"
  frontend:
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=160
  ollama:
    mem_limit: 1024m
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "0"
